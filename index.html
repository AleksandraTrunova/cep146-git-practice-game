<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Git Practice</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ["JetBrains Mono", "ui-monospace", "SF Mono", "Cascadia Code", "monospace"],
          },
          colors: {
            termbg: "#0a0f1f",
            terminput: "#070b18",
          },
        },
      },
    };
  </script>
</head>
<body
  class="m-0 min-h-screen font-mono text-[15px] leading-relaxed text-slate-100
         bg-slate-950 bg-[radial-gradient(1200px_800px_at_70%_-10%,#0b1530_0%,#020617_55%)]"
>
  <div class="mx-auto flex min-h-screen max-w-[1100px] flex-col px-5 pb-10 pt-6">
    <header class="mb-[22px] flex items-center gap-3 border-b border-slate-700 pb-[18px]">
      <h1 class="m-0 text-xl font-bold tracking-wide">git<span class="text-blue-400">::practice</span></h1>
      <div id="progress" class="ml-auto text-[13px] text-slate-500">Level 0 / 0</div>
    </header>

    <main class="grid flex-1 grid-cols-1 gap-5 md:grid-cols-2">
      <section class="rounded-[10px] border border-slate-700 bg-slate-800 p-[22px]">
        <div class="mb-[10px] flex items-center gap-3">
          <span
            id="level-badge"
            class="rounded-full border border-blue-400/40 bg-blue-400/10 px-[3px] py-[3px] text-[10px] font-bold tracking-widest text-blue-400"
            >LEVEL 1</span
          >
          <h2 id="level-title" class="m-0 text-lg text-slate-100">Loading…</h2>
        </div>
        <p id="level-objective" class="mb-[18px] mt-0 text-slate-500"></p>

        <div id="commands" class="mb-5 flex flex-wrap gap-2"></div>

        <div class="mb-[18px] border-l-[3px] border-blue-400 pl-[14px]">
          <h3 id="task-name" class="mb-[6px] mt-0 text-sm text-blue-400"></h3>
          <p id="task-instruction" class="m-0 text-slate-100"></p>
        </div>

        <button
          id="hint-btn"
          type="button"
          class="cursor-pointer rounded-md border border-amber-500/40 bg-transparent px-3 py-[6px] font-mono text-xs text-amber-500 transition-colors hover:bg-amber-500/10 disabled:cursor-default disabled:opacity-40"
        >
          show hint
        </button>
        <p
          id="hint-text"
          class="mb-0 mt-[14px] hidden border-l-[3px] border-amber-500 pl-3 text-[13px] text-amber-500"
        ></p>
      </section>

      <section
        id="terminal-panel"
        class="flex flex-col overflow-hidden rounded-[10px] border border-slate-700 bg-termbg"
      >
        <div
          id="terminal-output"
          class="max-h-[460px] min-h-[280px] flex-1 overflow-y-auto p-[18px] text-sm"
        ></div>
        <form id="terminal-form" autocomplete="off" class="flex items-center gap-2 border-t border-slate-700 bg-terminput px-[18px] py-[14px]">
          <span class="whitespace-nowrap font-medium text-green-500">user@git-practice:~$</span>
          <input
            type="text"
            id="command-input"
            spellcheck="false"
            placeholder="type a command…"
            aria-label="command input"
            class="flex-1 border-none bg-transparent font-mono text-sm text-slate-100 caret-green-500 outline-none placeholder:text-slate-500"
          />
        </form>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
